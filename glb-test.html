<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini2.glb Emissive Test</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0c10; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
    #scene { width: 100vw; height: 100vh; display: block; }
    #msg { position: absolute; top: 12px; left: 12px; padding: 8px 12px; background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; font-size: 14px; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="msg">Mini2.glb emissive test (pan/orbit to inspect)</div>
  <canvas id="scene"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.physicallyCorrectLights = true;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0c10);

    // Soft environment lighting so emissive stays visible but not blown out
    const pmrem = new THREE.PMREMGenerator(renderer);
    const env = pmrem.fromScene(new RoomEnvironment(), 0.1).texture;
    scene.environment = env;

    // Add a gentle rim + key light; emissive remains visible without over-darkening
    const hemi = new THREE.HemisphereLight(0xffffff, 0x0a0a0a, 0.35);
    scene.add(hemi);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
    keyLight.position.set(3, 5, 6);
    scene.add(keyLight);

    const fillLight = new THREE.PointLight(0x7ecbff, 0.6, 15, 2);
    fillLight.position.set(-2, 1, 3);
    scene.add(fillLight);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(2.8, 1.5, 3.2);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 1.1, 0);

    const loader = new GLTFLoader();

    // Helper to boost emissive if present
    function enhanceMaterials(root) {
        root.traverse(node => {
            if (node.isMesh && node.material) {
                const m = node.material;
                if (m.emissive) {
                    m.emissiveIntensity = Math.max(m.emissiveIntensity || 1, 1.35);
                }
                m.toneMapped = true;
                m.needsUpdate = true;
            }
        });
    }

    loader.load(
      'Mini2.glb',
      (gltf) => {
        const model = gltf.scene || gltf.scenes?.[0];
        enhanceMaterials(model);
        model.scale.setScalar(1.0);
        model.position.set(0, 0, 0);
        scene.add(model);
      },
      (progress) => {
        const percent = progress.total ? (progress.loaded / progress.total * 100).toFixed(1) : '...';
        document.getElementById('msg').textContent = `Loading Mini2.glb ${percent}%`;
      },
      (err) => {
        document.getElementById('msg').textContent = 'Error loading Mini2.glb (check console)';
        console.error('GLB load error', err);
      }
    );

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', onResize);

    const clock = new THREE.Clock();
    function animate() {
      const t = clock.getElapsedTime();
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
